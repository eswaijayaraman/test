name: Deploy to Zoho Catalyst

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Deploy to Zoho Catalyst
        if: success()
        run: |
          curl -X POST "$CATALYST_DEPLOY_URL" \
            -H "Authorization: Bearer $CATALYST_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"deployPath":"."}'
        env:
          CATALYST_DEPLOY_URL: ${{ secrets.CATALYST_DEPLOY_URL }}
          CATALYST_AUTH_TOKEN: ${{ secrets.CATALYST_AUTH_TOKEN }}
